<script>
const { useState, useEffect } = React;
const { createRoot } = ReactDOM;

// Mock Database
const mockDatabase = {
    calls: [
        { id: 1, caller: 'Dad - Mobile', phone: '+91 98765 43210', date: '2026-09-04 11:23', duration: '3m 12s', riskScore: 3, riskLevel: 'safe', threat: 'None' },
        { id: 2, caller: 'Unknown Caller', phone: '+1 555 0123', date: '2026-09-04 10:15', duration: '2m 34s', riskScore: 94, riskLevel: 'critical', threat: 'Voice Cloning, Financial Fraud' },
        { id: 3, caller: 'Bank Support', phone: '+91 22 1234 5678', date: '2026-09-03 16:45', duration: '5m 21s', riskScore: 87, riskLevel: 'high', threat: 'Suspicious Behavior' },
        { id: 4, caller: 'Mom - Mobile', phone: '+91 98765 43211', date: '2026-09-03 09:30', duration: '8m 45s', riskScore: 2, riskLevel: 'safe', threat: 'None' },
    ],
    contacts: [
        { id: 1, name: 'Dad', phone: '+91 98765 43210', relationship: 'Family', trusted: true, icon: '👨' },
        { id: 2, name: 'Mom', phone: '+91 98765 43211', relationship: 'Family', trusted: true, icon: '👩' },
        { id: 3, name: 'Office', phone: '+91 11 2345 6789', relationship: 'Work', trusted: true, icon: '💼' },
    ],
    statistics: {
        totalCalls: 18,
        safeCalls: 16,
        suspiciousCalls: 2,
        blockedCalls: 2,
        avgRiskScore: 27,
        threatsDetected: 6
    }
};

function App() {
    const [currentPage, setCurrentPage] = useState('landing');
    const [demoState, setDemoState] = useState(null);
    const [isAnalyzing, setIsAnalyzing] = useState(false);
    const [analysisComplete, setAnalysisComplete] = useState(false);
    const [reportSubmitted, setReportSubmitted] = useState(false);

    const startDemo = (type) => {
        setCurrentPage('dashboard');
        setTimeout(() => runDemo(type), 500);
    };

    const runDemo = (type) => {
        setDemoState(null);
        setIsAnalyzing(false);
        setAnalysisComplete(false);
        setReportSubmitted(false);

        if (type === 'safe') {
            setDemoState({
                caller: 'Dad - Mobile',
                phone: '+91 98765 43210',
                icon: '👨',
                type: 'safe'
            });
            setCurrentPage('safe-demo');
            setTimeout(() => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    setAnalysisComplete(true);
                }, 2000);
            }, 500);
        } else if (type === 'fake') {
            setDemoState({
                caller: 'Unknown Caller',
                phone: '+1 555 0123',
                icon: '❓',
                type: 'fake'
            });
            setCurrentPage('fake-demo');
            setTimeout(() => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    setAnalysisComplete(true);
                }, 2500);
            }, 500);
        } else if (type === 'sih') {
            // Full SIH demo flow
            setDemoState({
                caller: 'Bank Manager',
                phone: '+1 555 9999',
                icon: '🏦',
                type: 'fake'
            });
            setCurrentPage('fake-demo');
            setTimeout(() => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    setIsAnalyzing(false);
                    setAnalysisComplete(true);
                }, 2500);
            }, 500);
        }
    };

    const submitReport = () => {
        setReportSubmitted(true);
    };

    const renderContent = () => {
        switch (currentPage) {
            case 'landing':
                return React.createElement(LandingPage, { onStartDemo: startDemo, onNavigate: setCurrentPage });
            case 'dashboard':
                return React.createElement(Dashboard, { onDemo: runDemo });
            case 'safe-demo':
                return React.createElement(SafeCallDemo, {
                    demoState,
                    isAnalyzing,
                    analysisComplete
                });
            case 'fake-demo':
                return React.createElement(FakeCallDemo, {
                    demoState,
                    isAnalyzing,
                    analysisComplete
                });
            case 'report':
                return React.createElement(ReportScreen, {
                    reportSubmitted,
                    onSubmit: submitReport
                });
            case 'statistics':
                return React.createElement(Statistics);
            case 'contacts':
                return React.createElement(Contacts);
            case 'call-history':
                return React.createElement(CallHistory);
            case 'settings':
                return React.createElement(Settings);
            default:
                return React.createElement(Dashboard, { onDemo: runDemo });
        }
    };

    if (currentPage === 'landing') {
        return renderContent();
    }

    return React.createElement('div', { className: 'dashboard-layout' },
        React.createElement(Sidebar, { currentPage, onNavigate: setCurrentPage, onDemo: runDemo }),
        React.createElement('div', { className: 'main-content' }, renderContent())
